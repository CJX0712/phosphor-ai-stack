name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: P0 source guard
        run: python scripts/scan_guard.py

      - name: Unit tests
        run: python -m pytest -q tests

      - name: HTTP end to end
        run: python scripts/e2e_http.py

      - name: Full verification chain
        run: python scripts/verify.py

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-py${{ matrix.python-version }}
          path: .artifacts/verify-report.json

      - name: Upload OpenAPI contract
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check src tests scripts
