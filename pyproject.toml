[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phosphor-ai-stack"
version = "1.0.0"
description = "End to end retrieval augmented agent platform: hybrid retrieval, ReAct agent, multi-agent orchestration, evaluation and serving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["rag", "agent", "retrieval", "llm", "faiss", "fastapi", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "pypdf==6.18.1",
]

[project.optional-dependencies]
ai = [
  "numpy==2.5.3",
  "faiss-cpu==1.15.0",
  "fastembed==0.8.0",
  "rank-bm25==0.2.2",
  "llama-cpp-python==0.3.19",
]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.16.8",
]

[project.scripts]
phosphor = "phosphor.cli.main:main"

[tool.setuptools.packages.find]
where = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]
